<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale: zoom stays available. Inputs are 16px+ so iOS doesn't auto-zoom on focus. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1B1A17" />
    <meta name="color-scheme" content="dark light" />
    <!--
      Picks the theme before anything paints, so a light phone never flashes dark (or the other way
      round). The database is not open yet, so the choice is mirrored in localStorage by the app
      (src/components/ThemeSync.tsx). Nothing saved means "match the phone".
    -->
    <script>
      ;(function () {
        var light = false
        try {
          var pref = localStorage.getItem('dayload-theme')
          light = pref === 'light' || (pref !== 'dark' && window.matchMedia('(prefers-color-scheme: light)').matches)
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark')
        document.querySelector('meta[name="theme-color"]').setAttribute('content', light ? '#F3EFE7' : '#1B1A17')
      })()
    </script>

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DayLoad" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Manrope:wght@400..800&display=swap"
      rel="stylesheet"
    />

    <title>DayLoad</title>
    <!-- Paint the background before any CSS or JS loads, so there is no white flash or white rubber-band. -->
    <style>
      html,
      body {
        background: #1b1a17;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f3efe7;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
