# Builds DayLoad and publishes it to GitHub Pages on every push to main.
# One-time setup on GitHub: repo Settings, Pages, Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push replaces a deploy that is still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A failing test stops the deploy, so a broken version never goes live.
      - run: npm test
      # GitHub Pages serves a project from /DayLoad/, not from the root.
      - run: npm run build
        env:
          BASE_PATH: /DayLoad/
      # GitHub Pages has no "send every address to index.html" setting. It shows 404.html for an
      # unknown address, so a copy of the app there makes a reload of /DayLoad/plan open the app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
